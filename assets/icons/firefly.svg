<svg class="fly" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
    <!-- Project Bloom — Firefly. .fly-light is the piece firefly.js/CSS pulse; everything else stays still. -->
    <defs>
        <radialGradient id="flyGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%"  stop-color="#FFEFA0" stop-opacity=".55" />
            <stop offset="60%" stop-color="#FFEFA0" stop-opacity=".18" />
            <stop offset="100%" stop-color="#FFEFA0" stop-opacity="0" />
        </radialGradient>
    </defs>

    <circle class="fly-glow" cx="24" cy="26" r="15" fill="url(#flyGlow)" />

    <g class="fly-wings">
        <ellipse class="fly-wing" cx="17.5" cy="23" rx="5.4" ry="8.2" transform="rotate(-26 17.5 23)" />
        <ellipse class="fly-wing" cx="30.5" cy="23" rx="5.4" ry="8.2" transform="rotate(26 30.5 23)" />
    </g>

    <ellipse class="fly-body" cx="24" cy="27" rx="4.6" ry="7.2" />
    <circle class="fly-head" cx="24" cy="19.4" r="3" />

    <circle class="fly-light" cx="24" cy="32.6" r="2.7" />
</svg>