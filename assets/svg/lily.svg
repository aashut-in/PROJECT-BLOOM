<svg class="fl fl-lily" data-flower-type="lily" viewBox="0 0 140 320" xmlns="http://www.w3.org/2000/svg">
    <!-- Project Bloom — Lily. Six petals radiate from the bloom's own centre (fill-box), with a small stamen cluster drawn on top. -->
    <g class="fl-plant">

        <path class="fl-stem"
              d="M70,317 C71,250 66,190 70,140 C73,108 69,88 70,72" />

        <g class="fl-leaves">
            <g class="fl-leaf" transform="translate(65,248) rotate(-18)">
                <path d="M0,0 C-8,-8 -24,-11 -40,-4 C-28,4 -11,7 0,0 Z" />
            </g>
            <g class="fl-leaf" transform="translate(76,196) rotate(15)">
                <path d="M0,0 C8,-8 24,-11 40,-4 C28,4 11,7 0,0 Z" />
            </g>
            <g class="fl-leaf" transform="translate(63,150) rotate(-14)">
                <path d="M0,0 C-7,-7 -20,-9 -33,-3 C-23,3 -9,6 0,0 Z" />
            </g>
        </g>

        <g class="fl-bloom" transform="translate(70,72)">

            <g class="fl-petal" transform="rotate(-2)">
                <path d="M-6,0 C-9,-17 -6,-35 0,-47 C6,-35 9,-17 6,0 C4,4 -4,4 -6,0 Z" />
            </g>
            <g class="fl-petal" transform="rotate(58)">
                <path d="M-6,0 C-9,-16 -6,-33 0,-44 C6,-33 9,-16 6,0 C4,4 -4,4 -6,0 Z" />
            </g>
            <g class="fl-petal" transform="rotate(121)">
                <path d="M-6,0 C-9,-17 -6,-35 0,-47 C6,-35 9,-17 6,0 C4,4 -4,4 -6,0 Z" />
            </g>
            <g class="fl-petal" transform="rotate(179)">
                <path d="M-6,0 C-9,-16 -6,-33 0,-44 C6,-33 9,-16 6,0 C4,4 -4,4 -6,0 Z" />
            </g>
            <g class="fl-petal" transform="rotate(242)">
                <path d="M-6,0 C-9,-17 -6,-35 0,-47 C6,-35 9,-17 6,0 C4,4 -4,4 -6,0 Z" />
            </g>
            <g class="fl-petal" transform="rotate(301)">
                <path d="M-6,0 C-9,-16 -6,-33 0,-44 C6,-33 9,-16 6,0 C4,4 -4,4 -6,0 Z" />
            </g>

            <ellipse class="fl-sheen" cx="-4" cy="-14" rx="6" ry="14" transform="rotate(-8)" />

            <g class="fl-center">
                <line x1="0" y1="0" x2="-9" y2="-15" />
                <line x1="0" y1="0" x2="0" y2="-18" />
                <line x1="0" y1="0" x2="9" y2="-15" />
                <line x1="0" y1="0" x2="-5" y2="-17" />
                <line x1="0" y1="0" x2="5" y2="-17" />
                <circle cx="-9" cy="-15" r="1.6" />
                <circle cx="0" cy="-18" r="1.6" />
                <circle cx="9" cy="-15" r="1.6" />
                <circle cx="-5" cy="-17" r="1.6" />
                <circle cx="5" cy="-17" r="1.6" />
            </g>

        </g>

    </g>
</svg>