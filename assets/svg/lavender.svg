<svg class="fl fl-lavender" data-flower-type="lavender" viewBox="0 0 140 320" xmlns="http://www.w3.org/2000/svg">
    <!-- Project Bloom — Lavender. .fl-bloom here holds many small .fl-floret ellipses climbing a spike, instead of one large bloom. -->
    <g class="fl-plant">

        <path class="fl-stem"
              d="M70,317 C70,270 68,225 70,182 C71,150 69,122 70,100" />

        <g class="fl-leaves">
            <g class="fl-leaf" transform="translate(66,255) rotate(-20)">
                <path d="M0,0 C-5,-5 -14,-6 -23,-1 C-16,3 -6,5 0,0 Z" />
            </g>
            <g class="fl-leaf" transform="translate(74,225) rotate(18)">
                <path d="M0,0 C5,-5 14,-6 23,-1 C16,3 6,5 0,0 Z" />
            </g>
        </g>

        <g class="fl-bloom" transform="translate(70,100)">
            <ellipse class="fl-floret" cx="0"    cy="-3"  rx="3.6" ry="5.6" transform="rotate(-6)" />
            <ellipse class="fl-floret" cx="-3.6" cy="-12" rx="3.4" ry="5.4" transform="rotate(-18)" />
            <ellipse class="fl-floret" cx="3.6"  cy="-12" rx="3.4" ry="5.4" transform="rotate(18)" />
            <ellipse class="fl-floret" cx="-3.2" cy="-21" rx="3.2" ry="5.2" transform="rotate(-14)" />
            <ellipse class="fl-floret" cx="3.2"  cy="-21" rx="3.2" ry="5.2" transform="rotate(14)" />
            <ellipse class="fl-floret" cx="0"    cy="-30" rx="3.1" ry="5.1" transform="rotate(4)" />
            <ellipse class="fl-floret" cx="-2.8" cy="-38" rx="2.9" ry="4.8" transform="rotate(-12)" />
            <ellipse class="fl-floret" cx="2.8"  cy="-38" rx="2.9" ry="4.8" transform="rotate(12)" />
            <ellipse class="fl-floret" cx="0"    cy="-46" rx="2.7" ry="4.5" transform="rotate(-4)" />
            <ellipse class="fl-floret" cx="-2.2" cy="-53" rx="2.4" ry="4"   transform="rotate(-10)" />
            <ellipse class="fl-floret" cx="2.2"  cy="-53" rx="2.4" ry="4"   transform="rotate(10)" />
            <ellipse class="fl-floret" cx="0"    cy="-60" rx="2"   ry="3.4" transform="rotate(2)" />
            <ellipse class="fl-floret" cx="0"    cy="-66" rx="1.6" ry="2.6" />
        </g>

    </g>
</svg>