<!DOCTYPE html>

<html lang="en">

<head>

    <!-- Character Encoding -->
    <meta charset="UTF-8">

    <!-- Mobile Scaling -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- Browser Theme -->
    <meta name="theme-color" content="#09090F">

    <!-- SEO -->
    <meta
        name="description"
        content="A bouquet across the distance."
    >

    <title>Project Bloom • A Bouquet Across the Distance 🌷</title>

    <!-- Fonts -->
    <!-- Later:
         Cormorant Garamond
         Inter
         Caveat
    -->

    <!-- CSS -->

    <link rel="stylesheet" href="css/01-base.css">
    <link rel="stylesheet" href="css/02-layout.css">
    <link rel="stylesheet" href="css/03-sky.css">
    <link rel="stylesheet" href="css/04-stars.css">
    <link rel="stylesheet" href="css/05-particles.css">
    <link rel="stylesheet" href="css/06-intro.css">
    <link rel="stylesheet" href="css/07-effects.css">
    <link rel="stylesheet" href="css/08-animation.css">
    <link rel="stylesheet" href="css/09-responsive.css">

</head>

<body>

<!-- ====================================================== -->
<!-- Entire Experience -->
<!-- ====================================================== -->

<div id="experience">

    <!-- ============================================== -->
    <!-- Night Sky -->
    <!-- ============================================== -->

    <div id="sky">

        <div id="atmosphere"></div>

    </div>
    
    <div id="stars">

        <div id="stars-far"></div>

        <div id="stars-mid"></div>

        <div id="stars-near"></div>
        
    </div>

    <!-- ============================================== -->
    <!-- Cinematic Overlay -->
    <!-- ============================================== -->

    <div id="overlay">

    <div class="gradient"></div>

    <div class="vignette"></div>

    <div id="lighting"></div>

    </div>
    <!-- ============================================== -->
    <!-- Intro Scene -->
    <!-- ============================================== -->

    <main id="intro">

        <h1 id="intro-text">

            I wanted to give you flowers...

        </h1>

        <!-- Sparkle appears before
             the bouquet begins -->

        <div id="intro-sparkle"></div>

    </main>

    <!-- ============================================== -->
    <!-- Bouquet Scene -->
    <!-- Hidden until Timeline -->
    <!-- ============================================== -->

    <section id="bouquet">

    </section>

    <!-- ============================================== -->
    <!-- Firefly -->
    <!-- Hidden until later -->
    <!-- ============================================== -->

    <div id="firefly"></div>

    <!-- ============================================== -->
    <!-- Hidden Letter -->
    <!-- ============================================== -->

    <section id="letter">

    </section>

</div>

<!-- ====================================================== -->
<!-- JavaScript -->
<!-- ====================================================== -->

<script type="module" src="js/app.js"></script>
</body>

</html>
